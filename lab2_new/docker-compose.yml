version: '3.8'

services:
  # Consul service for service discovery
  consul:
    image: consul:1.15.4
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - soa-network

  # HAProxy load balancer
  haproxy:
    image: haproxy:2.8
    container_name: haproxy
    ports:
      - "9192:8080"  # Movie service through Mule ESB
      - "9292:8082"  # Oscar service
      - "8404:8404"  # HAProxy stats
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:ro
    depends_on:
      - mule-esb
      - oscar-service-1
      - oscar-service-2
    networks:
      - soa-network

  # Mule ESB - Enterprise Service Bus
  mule-esb:
    build:
      context: .
      dockerfile: Dockerfile.mule
    container_name: mule-esb
    ports:
      - "8081:8081"  # Mule ESB HTTP listener
      - "8443:8443"  # Mule ESB HTTPS listener
    environment:
      - MULE_HOME=/opt/mule
    networks:
      - soa-network
    depends_on:
      - soap-movie-service-1
      - soap-movie-service-2

  # SOAP Movie Service instances (Tomcat)
  soap-movie-service-1:
    build: ./movie-service
    container_name: soap-movie-service-1
    ports:
      - "8086:8080"
    environment:
      - CATALINA_OPTS=-Xms512m -Xmx1024m
    networks:
      - soa-network

  soap-movie-service-2:
    build: ./movie-service
    container_name: soap-movie-service-2
    ports:
      - "8087:8080"
    environment:
      - CATALINA_OPTS=-Xms512m -Xmx1024m
    networks:
      - soa-network

  # REST Facade instances (translate REST to SOAP) - now route through Mule ESB
  rest-facade-1:
    build: ./rest-middleware
    container_name: rest-facade-1
    ports:
      - "8083:8080"
    environment:
      - mule.esb.url=http://mule-esb:8081
      - SERVER_PORT=8080
    depends_on:
      - mule-esb
    networks:
      - soa-network

  rest-facade-2:
    build: ./rest-middleware
    container_name: rest-facade-2
    ports:
      - "8084:8080"
    environment:
      - mule.esb.url=http://mule-esb:8081
      - SERVER_PORT=8080
    depends_on:
      - mule-esb
    networks:
      - soa-network

  # Oscar Service instances (unchanged)
  oscar-service-1:
    build: ./oscar-service
    container_name: oscar-service-1
    environment:
      - MOVIE_SERVICE_BASE_URL=http://rest-facade-1:8080/movie-service/api
    depends_on:
      - rest-facade-1
    networks:
      - soa-network

  oscar-service-2:
    build: ./oscar-service
    container_name: oscar-service-2
    ports:
      - "9391:8080"
      - "9392:8181"
    environment:
      - MOVIE_SERVICE_BASE_URL=http://rest-facade-2:8080/movie-service/api
    depends_on:
      - rest-facade-2
    networks:
      - soa-network



networks:
  soa-network:
    driver: bridge