version: '3.8'

services:
  # Consul service for service discovery
  consul:
    image: consul:1.15.4
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - soa-network

  # HAProxy load balancer
  haproxy:
    image: haproxy:2.8
    container_name: haproxy
    ports:
      - "9192:8080"
      - "9292:8082"
      - "8404:8404"
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:ro
    depends_on:
      - movie-service-1
      - movie-service-2
      - oscar-service-1
      - oscar-service-2
    networks:
      - soa-network

  # Movie Service instances
  movie-service-1:
    build: ./movie-service
    container_name: movie-service-1
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      - consul
    networks:
      - soa-network

  movie-service-2:
    build: ./movie-service
    container_name: movie-service-2
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      - consul
    networks:
      - soa-network

  # Oscar Service instances
  oscar-service-1:
    build: ./oscar-service
    container_name: oscar-service-1
    environment:
      - MOVIE_SERVICE_BASE_URL=https://movie-service-1:8443
    networks:
      - soa-network

  oscar-service-2:
    build: ./oscar-service
    container_name: oscar-service-2
    ports:
      - "9391:8080"
      - "9392:8181"
    environment:
      - MOVIE_SERVICE_BASE_URL=https://movie-service-2:8443
    networks:
      - soa-network

networks:
  soa-network:
    driver: bridge